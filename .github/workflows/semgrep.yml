# Semgrep — fast pattern-based SAST (secrets + security-audit + AegisLink rules)
#
# Free, no Semgrep account/token needed: we run the open-source CLI against the
# public registry packs plus our own .semgrep/aegislink-rules.yml, which encodes
# the "Reglas de Oro — Seguridad" so they cannot be silently reintroduced.
#
# Findings are uploaded as SARIF to Security → Code scanning (same tab as
# CodeQL). Runs on PRs to main, push to main, and weekly.
#
# NOTE: never add secrets, real IPs, or key material to this workflow.

name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7

      - name: Run Semgrep
        # p/secrets        — hardcoded credentials / key material
        # p/security-audit — broad security smells (injection, ssrf, etc.)
        # p/typescript     — TS-specific correctness/security
        # .semgrep/        — AegisLink golden-rule checks
        # Non-blocking exit so SARIF still uploads; findings gate via the
        # code-scanning tab. Tighten to a hard fail once the baseline is clean.
        run: |
          semgrep scan \
            --config p/secrets \
            --config p/security-audit \
            --config p/typescript \
            --config .semgrep/ \
            --sarif --output semgrep.sarif \
            --error || true

      # GitHub code scanning ignores the SARIF `suppressions` property, so a
      # finding annotated `// nosemgrep: <rule>` in source (the sanctioned way
      # to justify a dev-only fallback, see .semgrep/aegislink-rules.yml) still
      # became a red "Semgrep OSS" alert. Drop suppressed results here; the
      # justification lives next to the code, where reviewers read it.
      - name: Drop in-source-suppressed findings from the SARIF
        if: always()
        run: |
          python3 - <<'PY'
          import json
          with open('semgrep.sarif') as f:
              sarif = json.load(f)
          dropped = 0
          for run in sarif.get('runs', []):
              kept = []
              for r in run.get('results', []):
                  if r.get('suppressions'):
                      dropped += 1
                  else:
                      kept.append(r)
              run['results'] = kept
          with open('semgrep.sarif', 'w') as f:
              json.dump(sarif, f)
          print(f'dropped {dropped} suppressed finding(s)')
          PY

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
