# CodeQL — semantic static analysis for JavaScript/TypeScript
#
# Free for public repos. Scans the whole tree (mobile/ + server/ + desktop/)
# with GitHub's security-and-quality query suite and uploads findings to the
# repo's Security → Code scanning tab. Runs on PRs to main, on push to main,
# and weekly so new advisories surface even without a code change.
#
# This is automated triage, NOT a substitute for a human crypto audit — it
# catches injection / unsafe-deserialization / taint-flow patterns, and gives
# OTF/OSTIF applicants concrete evidence that the project runs continuous SAST.
#
# NOTE: never add secrets, real IPs, or key material to this workflow.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      # Phase 0/1 of AegisLink Work has no product code yet (prototype/ is
      # excluded by the config). CodeQL fails hard when it sees no source, so
      # skip analysis until a package exists instead of teaching everyone to
      # ignore a red X. Mirrors the `detect` job in ci.yml.
      - id: code
        name: Detect product code
        run: |
          if ls server/package.json mobile/package.json desktop/package.json >/dev/null 2>&1; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"; echo "Product code present."
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"; echo "No product code yet — skipping CodeQL."
          fi

      - name: Initialize CodeQL
        if: steps.code.outputs.has_code == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Query suite (security-extended) and paths-ignore (generated/vendored
          # dirs) live in the config so they apply to every analysis run.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        if: steps.code.outputs.has_code == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
