# AegisLink custom Semgrep rules — encode the "Reglas de Oro — Seguridad"
# from CLAUDE.md so they can never be silently reintroduced.
#
# These are deliberately high-precision (low false-positive) checks for the
# exact failure modes that were injected at least once before. Run alongside
# the public packs (p/secrets, p/security-audit) in semgrep.yml.
rules:
  - id: aegislink-no-silent-decrypt-fallback
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Encryption/decryption must FAIL CLOSED. A catch block that returns the
      plaintext / original body silently degrades E2EE (Regla de Oro Seguridad
      #1). Throw the error instead of falling back to cleartext.
    metadata:
      category: security
      golden-rule: '1 — el cifrado nunca degrada en silencio'
    patterns:
      - pattern: |
          try { ... } catch ($E) { ... return $PLAIN; ... }
      - metavariable-regex:
          metavariable: $PLAIN
          # High-precision: only names that unambiguously mean cleartext, so a
          # FTS→LIKE or network fallback returning `body`/`message` does not trip.
          regex: (?i).*(plaintext|cleartext|decrypted|unencrypted).*

  - id: aegislink-no-plain-prefix-persist
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Do not persist an unencrypted body tagged with a "plain:" prefix. In a
      packaged build the at-rest key may be unavailable; fail closed rather than
      writing cleartext (Regla de Oro Seguridad #1 / #6).
    metadata:
      category: security
      golden-rule: '1 / 6 — sin claves en plain:'
    # Match the WRITE (constructing a `plain:`-prefixed value), NOT a read/guard
    # such as `startsWith('plain:')` — those detect plaintext, they don't create
    # it. A genuine dev-only fallback gated by `app.isPackaged` should carry a
    # `// nosemgrep: aegislink-no-plain-prefix-persist` justification.
    patterns:
      - pattern-either:
          - pattern: '"plain:" + $X'
          - pattern: "'plain:' + $X"
          - pattern: '`plain:${$X}`'
    paths:
      exclude:
        - '*.test.ts'
        - '*.test.tsx'
        - '*.spec.ts'
        - '**/__tests__/**'

  - id: aegislink-no-key-material-on-wire
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Possible key material leaving the device. Fields named chainKey /
      messageKey / rootKey must never be placed on an object that is emitted,
      sent, posted or stringified to the relay (Regla de Oro Seguridad #2).
      Only sealed/encrypted blobs travel. Verify this is not on the wire.
    metadata:
      category: security
      golden-rule: '2 — cero material de clave en el wire'
    patterns:
      - pattern-either:
          - pattern: '$SOCKET.emit($EV, { ..., $K: $V, ... })'
          - pattern: 'JSON.stringify({ ..., $K: $V, ... })'
      - metavariable-regex:
          metavariable: $K
          regex: ^(chainKey|messageKey|rootKey|ck|mk|rk|privateKey|privKey|secretKey)$

  - id: aegislink-no-console-log-production
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      No console.log in production code (CLAUDE.md convention). Ratchet/crypto
      diagnostics must sit behind a dedicated flag and hash key prefixes
      (Regla de Oro Seguridad #6). Remove or gate this log.
    metadata:
      category: security
      golden-rule: '6 — sin fugas por logs'
    patterns:
      - pattern: console.log(...)
    paths:
      exclude:
        - '*.test.ts'
        - '*.test.tsx'
        - '*.spec.ts'
        - '**/__tests__/**'
        - 'scripts/**'
        # The logger IS the sanctioned console wrapper — product code calls
        # logger.*, which internally reaches console. Flagging the abstraction
        # that enforces the rule is a false positive.
        - '**/logger.ts'
        # Build-time config, not the shipped runtime bundle. Expo config
        # plugins run only at prebuild and print to the prebuild log (same
        # carve-out as .github/codeql/codeql-config.yml).
        - '**/metro.config.js'
        - '**/plugins/*.js'
        - '**/*.plugin.js'

  - id: aegislink-no-cors-wildcard
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      CORS wildcard origin '*' must not be the default in production
      (Regla de Oro Seguridad #6 — producción falla cerrado). Use an explicit
      allowlist.
    metadata:
      category: security
      golden-rule: '6 — sin CORS * por defecto'
    patterns:
      - pattern-either:
          - pattern: 'origin: "*"'
          - pattern: |
              cors({ ..., origin: "*", ... })
    paths:
      exclude:
        - '*.test.ts'
        - '*.test.tsx'
        - '*.spec.ts'
        - '**/__tests__/**'

  - id: aegislink-org-table-needs-org-id
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A query against an organization-scoped table must constrain org_id.
      In TENANCY=multi one relay serves many organizations, so a SELECT/UPDATE/
      DELETE that omits org_id reads or mutates another org's rows the moment a
      caller supplies an id from elsewhere (DEPLOYMENT-MODES.md; golden rule
      "cero metadatos" + #7). Add `org_id = ?` to the WHERE clause, or — if the
      query really is org-wide maintenance (a TTL purge) — annotate it with
      `// nosemgrep: aegislink-org-table-needs-org-id` and say why.
    metadata:
      category: security
      golden-rule: '7 — aislamiento entre organizaciones'
    patterns:
      # Any SQL string naming a Work table...
      - pattern-regex: '(?i)(select|update|delete)[\s\S]{0,400}?\b(used_nonces|org_members|org_devices|org_rooms|org_room_members|org_policies|org_invites|org_audit)\b[\s\S]{0,400}'
      # ...that never mentions org_id anywhere in the same statement.
      - pattern-not-regex: '(?i)[\s\S]*org_id[\s\S]*'
    paths:
      exclude:
        - '*.test.ts'
        - '*.test.tsx'
        - '*.spec.ts'
        - '**/__tests__/**'
